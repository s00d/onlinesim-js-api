name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      # Package linters on the built artifact: publint (exports, files) and attw (ESM, CJS and types resolve).
      - run: npm run lint:package
      # Pack, check the tarball contents, install it into an empty project, run the README "Testing" example.
      - run: npm run smoke:artifact

  # The dev toolchain (vitest, tsup) needs Node 22+, the package supports Node 18:
  # build on 22, then run the built ESM and CJS bundles and the packed artifact on 18.
  node18:
    name: smoke (node 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: node --version && node tests/smoke-dist.mjs
      - run: node tests/smoke-artifact.mjs
